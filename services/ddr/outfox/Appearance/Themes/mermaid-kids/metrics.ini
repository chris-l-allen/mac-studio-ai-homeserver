[Global]
FallbackTheme=mermaid

[ScreenNewInit]
PrepareScreens=""
NextScreen=Branch.TitleMenu()

[ScreenProfileLoad]
NextScreen="ScreenSelectMusic"

[ScreenSelectPlayMode]
ChoiceNames="Kids"
DefaultChoice="Kids"
ChoiceKids="applydefaultoptions;name,Kids;text,Kids;playmode,regular;difficulty,beginner;screen,ScreenSelectMusic;setenv,sMode,Normal"

[ScreenEvaluationNormal]
NextScreen="ScreenSelectMusic"

[ScreenSelectMusic]
DefaultSort="Preferred"
NextScreen="ScreenGameplay"
SelectMenuAvailable=false
OptionsMenuAvailable=true
ModeMenuAvailable=false
ShowSongOptions=false
PreviousSongButton="MenuUp"
NextSongButton="MenuDown"
PreviousGroupButton=""
NextGroupButton=""
PreviousDifficultyButton="MenuLeft"
NextDifficultyButton="MenuRight"

[MusicWheel]
ItemTransformFunction=function(self,offsetFromCenter,itemIndex,numItems) self:y(offsetFromCenter*68); end
HighlightOnCommand=blend,'add';diffuseramp;effectcolor2,Color.White;effectcolor1,color("1,1,1,0.8");effectclock,'beatnooffset'
NumWheelItems=13
ShowRoulette=false
ShowRandom=false
ShowPortal=false
EnableFavsOnWheel=false

[GameState]
AllowLateJoin=0
[MusicWheelItem]
SectionExpandedOnCommand=zoom,1.3;x,-190;maxwidth,260;horizalign,left;shadowlength,1;strokecolor,color("#163742")
SectionCollapsedOnCommand=zoom,1.3;x,-190;maxwidth,260;horizalign,left;shadowlength,1;strokecolor,color("#163742")
SectionCountX=-9999
SectionCountY=-9999
SectionCountOnCommand=visible,false;x,-9999;y,-9999
