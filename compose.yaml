# ---------------------------------------------------------------------------
# Homelab web/services stack.
#
# Ollama is intentionally NOT defined here: on Apple Silicon it must run
# natively so it can use the Metal GPU. Docker/OrbStack containers on macOS
# have no GPU passthrough, so a containerized Ollama would fall back to CPU.
#
# Start with:  docker compose up -d
# ---------------------------------------------------------------------------
name: homelab

# NOTE: Caddy is NOT a container here. The .allen stack needs native Caddy (it
# reads the portal-issued certs from disk and owns :80/:443). Run it with:
#   caddy run --config caddy/Caddyfile
# or the launchd unit launchd/local.home-network.caddy.plist.
# This compose file is only for the optional containerized extras below.

services:
  # Landing page / dashboard for all services
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=*
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ./homepage:/app/config
    networks:
      - lan

  # Uptime / health monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Toronto}
    volumes:
      - uptime_data:/app/data
    networks:
      - lan

networks:
  lan:
    driver: bridge

volumes:
  uptime_data:
